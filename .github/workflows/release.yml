name: Release

on:
    release:
        types: [published]

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build-release-assets:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.20.2
                  cache: npm

            - name: Set up npm
              run: npm install -g npm@10.8.2

            - name: Verify environment
              run: |
                  node --version
                  npm --version

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.event.release.tag_name }}" main.js styles.css manifest.json --clobber

            - name: Attest release assets
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      styles.css
                      manifest.json
